name: TUI Golden

on:
  pull_request:
    branches: [main]

jobs:
  statusline:
    name: Statusline golden render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Golden check (width matrix + structure + timing)
        run: bash scripts/ci/check-statusline.sh

      # vhs-action@v2's dependency installer looks for a stale
      # ffmpeg-n5.1-* asset on BtbN/FFmpeg-Builds and fails when that tag
      # rotates off "latest". Install ffmpeg/ttyd from Ubuntu and pin the
      # vhs binary ourselves so the visual gate is deterministic.
      - name: Install vhs + terminal deps (pinned)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg ttyd curl ca-certificates fonts-dejavu-core
          VHS_VERSION=0.11.0
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) VHS_ARCH=x86_64 ;;
            aarch64|arm64) VHS_ARCH=arm64 ;;
            *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          # charmbracelet release asset names: vhs_${ver}_Linux_${arch}.tar.gz
          # arm64 asset uses aarch64 in some releases — probe both.
          TMP=$(mktemp -d)
          BASE="https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}"
          for CAND in \
            "vhs_${VHS_VERSION}_Linux_${VHS_ARCH}.tar.gz" \
            "vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            "vhs_${VHS_VERSION}_Linux_arm64.tar.gz" \
            "vhs_${VHS_VERSION}_Linux_aarch64.tar.gz"
          do
            if curl -fsSL -o "$TMP/vhs.tgz" "$BASE/$CAND"; then
              echo "downloaded $CAND"
              break
            fi
          done
          tar -xzf "$TMP/vhs.tgz" -C "$TMP"
          BIN=$(find "$TMP" -type f -name vhs | head -n1)
          sudo install -m 755 "$BIN" /usr/local/bin/vhs
          vhs --version
          ffmpeg -version | head -n1
          ttyd --version

      - name: Render vhs goldens
        env:
          # Prevent termenv from disabling ANSI under GHA.
          CI: ""
          COLORTERM: truecolor
        run: bash scripts/ci/render-vhs-goldens.sh

      - name: Compare vhs goldens
        run: bash scripts/ci/check-vhs-goldens.sh

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statusline-render
          path: |
            scripts/ci/vhs-out/*.png
            scripts/ci/vhs-out/*.gif
            scripts/ci/goldens/*.png
          if-no-files-found: warn
