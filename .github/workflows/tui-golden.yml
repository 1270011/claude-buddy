name: TUI Golden

on:
  pull_request:
    branches: [main]

jobs:
  statusline:
    name: Statusline golden render
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Golden check (width matrix + structure + timing)
        run: bash scripts/ci/check-statusline.sh

      # Pixel goldens are platform-sensitive (font rasterization). Both the
      # committed baselines and CI renders go through the pinned linux/amd64
      # image in scripts/ci/Dockerfile.vhs — never host macOS vhs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Render vhs goldens (pinned linux/amd64 container)
        env:
          CI: ""
          COLORTERM: truecolor
          VHS_GOLDEN_IMAGE: coding-buddy-vhs:ci
        run: bash scripts/ci/render-vhs-goldens.sh

      - name: Install ffmpeg for golden compare
        run: sudo apt-get install -y -qq ffmpeg

      - name: Compare vhs goldens
        run: bash scripts/ci/check-vhs-goldens.sh

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statusline-render
          path: |
            scripts/ci/vhs-out/*.png
            scripts/ci/vhs-out/*.gif
            scripts/ci/goldens/*.png
          if-no-files-found: warn
